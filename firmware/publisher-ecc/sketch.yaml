# Reproducible build profile for the Lab 08 ECC publisher (arduino-cli).
#
# Pins core + libraries to exact versions so any machine builds identically,
# regardless of what is installed globally. Like a package.json/lockfile.
#
# Build:   arduino-cli compile --profile devkitv1 firmware/publisher-ecc
# Flash:   arduino-cli upload  --profile devkitv1 -p <PORT> firmware/publisher-ecc
# Monitor: arduino-cli monitor -p <PORT> -c baudrate=115200
#
# Target board: ESP32 DevKit V1 (classic ESP32-WROOM-32). The S3 mentioned in
# the older docs is NOT required — these pins (GPIO4/21/22/35/36/26) exist on
# the DevKit V1 too, so this sketch runs unchanged on either board; only the
# fqbn differs (esp32:esp32:esp32doit-devkit-v1 here, esp32:esp32:esp32s3 there).
profiles:
  devkitv1:
    notes: ESP32 DevKit V1 (ESP32-WROOM-32) — classic ESP32
    fqbn: esp32:esp32:esp32doit-devkit-v1
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - PubSubClient (2.8)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit BME280 Library (2.3.0)
      - Adafruit BusIO (1.17.4)
      - ArduinoJson (7.4.3)
      - micro-ecc (1.0.0)

default_profile: devkitv1
