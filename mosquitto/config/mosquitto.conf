# =============================================================================
# Mosquitto broker configuration — classroom LAN profile (matches the lab guide)
#
# This DEFAULT config is intentionally open (anonymous access) so every ESP32
# and laptop on the classroom LAN can connect without credentials. For a
# hardened / production profile (authentication + TLS) see the "Security"
# section of the project README.
# =============================================================================

# --- Network listener -------------------------------------------------------
listener 1883

# --- Access control (LAN lab default) ---------------------------------------
allow_anonymous true

# --- Logging ----------------------------------------------------------------
log_type all
log_dest stdout

# --- Persistence ------------------------------------------------------------
# Retained messages and queued QoS>0 messages survive a broker restart.
# persistence_location lives under the mounted data volume (/mosquitto/data),
# which maps to ${DATA_PATH}/mosquitto/data on the host.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
